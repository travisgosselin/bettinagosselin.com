<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | Bettina Gosselin</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{origin}}{{base}}assets/images/book-cover.jpg">
  <meta property="article:published_time" content="{{date}}">
  <meta name="author" content="Bettina Gosselin">
  <link rel="icon" href="{{base}}assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{base}}assets/css/site.css">
  <meta name="theme-color" content="#102b37">
</head>
<body class="page-article">
{{header}}
<main id="main">
  <article class="article-shell">
    <header class="article-header">
      <a class="back-link" href="{{base}}blog/"><span aria-hidden="true">←</span> Back to the blog</a>
      <p class="eyebrow"><time datetime="{{date}}">{{display_date}}</time> <span aria-hidden="true">/</span> Personal</p>
      <h1>{{title}}</h1>
      <a class="article-byline" href="{{base}}my-story.html"><img src="{{base}}assets/images/bettina.jpg" alt="" width="56" height="56"><span>By <em>Bettina Gosselin</em></span></a>
    </header>
    <div class="article-body">{{body}}</div>
    <footer class="article-author">
      <img src="{{base}}assets/images/bettina.jpg" alt="Bettina Gosselin" width="80" height="80" loading="lazy">
      <div><p class="author-name">Bettina Gosselin</p><p class="eyebrow">Author of Anchor of Truth</p><a class="text-link" href="{{base}}my-story.html">Read my story <span aria-hidden="true">↗</span></a></div>
    </footer>
    <a class="back-link article-back" href="{{base}}blog/"><span aria-hidden="true">←</span> Back to all reflections</a>
  </article>
  {{book_cta}}
</main>
{{footer}}
</body>
</html>
