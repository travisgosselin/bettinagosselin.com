name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-site-${{ github.ref }}
  cancel-in-progress: false
env:
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://bettinagosselin.com' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build local test paths
        run: npm run build
        env:
          BASE_PATH: /
      - run: npx playwright install --with-deps chromium
      - name: Check responsive pages
        run: npm run test:browser
        env:
          BASE_PATH: /
      - name: Package configured production paths
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  publish:
    if: vars.PAGES_ENABLED == 'true' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-site
          path: dist/
      - name: Configure enabled Pages site
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify public URL configuration
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module -e '
            const expected = process.env.PAGES_BASE_PATH.replace(/\/$/, "") + "/";
            if (process.env.SITE_ORIGIN !== process.env.PAGES_ORIGIN || process.env.BASE_PATH !== expected) {
              throw new Error("Set SITE_ORIGIN and BASE_PATH repository variables to match Pages before publishing");
            }
          '
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
