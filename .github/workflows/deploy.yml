name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-site-${{ github.ref }}
  cancel-in-progress: false
env:
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://bettinagosselin.com' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build local test paths
        run: npm run build
        env:
          BASE_PATH: /
      - run: npx playwright install --with-deps chromium
      - name: Check responsive pages
        run: npm run test:browser
        env:
          BASE_PATH: /
      - name: Package configured production paths
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  publish:
    if: vars.PAGES_ENABLED == 'true' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: dist/
      - name: Configure enabled Pages site
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify public URL configuration
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module -e '
            const expected = process.env.PAGES_BASE_PATH.replace(/\/$/, "") + "/";
            if (process.env.SITE_ORIGIN !== process.env.PAGES_ORIGIN || process.env.BASE_PATH !== expected) {
              throw new Error("Set SITE_ORIGIN and BASE_PATH repository variables to match Pages before publishing");
            }
          '
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
